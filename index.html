<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خانه پدری | منوی دیجیتال</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

    <header class="hero">

        <div class="logo">
            ☕
        </div>

        <h1>
            خانه پدری
        </h1>

        <p>
            💜 یک خانه، سه قصه، هزار خاطره 💜
        </p>

        <div class="search-box">

            <input
                id="search"
                type="text"
                placeholder="جستجو در منو..."
            >

        </div>

    </header>


    <!-- دسته بندی ها -->

    <nav class="category-nav" id="categoryNav"></nav>


    <!-- منوی ویژه -->

    <section class="featured">

        <div id="featured-products"></div>

    </section>


    <!-- کلاسور -->

    <main id="menu">

        <div class="book-wrapper">

            <button id="prevBtn" class="page-btn prev-btn">
                ‹
            </button>

            <div class="book" id="book">

                <div class="book-cover">

                    <div class="cover-decoration">
                        ☕
                    </div>

                    <h2>
                        خانه پدری
                    </h2>

                    <p>
                        منوی کافه
                    </p>

                </div>

            </div>

            <button id="nextBtn" class="page-btn next-btn">
                ›
            </button>

        </div>


        <div class="page-info">

    <span class="swipe-hint">
        ← ورق بزنید →
    </span>

    <span class="page-number">
        <span id="currentPage">1</span>
        /
        <span id="totalPages">1</span>
    </span>

</div>

    </main>


    <!-- نتایج جستجو -->

    <section id="searchResults" class="search-results"></section>


    <footer>

        <p>
            خانه پدری ☕
        </p>

        <span>
            Digital Menu
        </span>

    </footer>

</div>


<!-- نمایش بزرگ عکس -->

<div id="imageModal" class="image-modal">

    <span class="close-modal">
        &times;
    </span>

    <img id="modalImage" src="" alt="">

</div>


<script src="app.js"></script>

</body>

</html>
